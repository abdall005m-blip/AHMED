<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus — Personal Dashboard & Entertainment</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/bubbles.css">

  <style>
    /* Navigation item active state */
    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }
    .nav-item .nav-label {
      font-size: 11px;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .nav-item.active {
      color: var(--primary);
      transform: translateY(-2px);
    }
    .nav-item.active .nav-label {
      color: var(--primary);
      font-weight: 700;
    }
    .nav-item:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <!-- Root App Shell -->
  <div id="app" style="display: flex; flex-direction: column; min-height: 100vh;"></div>

  <!-- ES Module App Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
